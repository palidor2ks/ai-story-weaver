name: Deploy Edge Functions to Supabase production

# Why this exists: in this repo's Lovable + Supabase setup, merging to main is *supposed* to
# deploy Edge Functions to production, but that path proved unreliable — functions stayed on
# their previously-deployed versions after merges and had to be pushed by hand. This workflow
# makes the deploy explicit and authoritative: on every merge to main that touches a function
# (or the shared config), it deploys the functions straight from the repo via the Supabase CLI.
# Worst case it's a redundant no-op; it can never leave prod behind main.
#
# Sibling to apply-prod-migrations.yml, which handles the migration half of the same gap.
#
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN — a personal access token from
# Supabase Dashboard → Account → Access Tokens. The project ref is public (it's in config.toml),
# so it stays inline below.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: prod-edge-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ornnzinjrcyigazecctf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail loudly if the token is missing rather than silently skipping the deploy
      # (the same "don't let prod fall behind unnoticed" guard apply-prod-migrations.sh uses).
      - name: Verify deploy credentials are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is not set — cannot deploy Edge Functions."
            echo "Add it under Settings → Secrets and variables → Actions (Supabase Dashboard → Account → Access Tokens)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy ALL functions, not just the changed ones: many functions import shared helpers
      # from supabase/functions/_shared, so a change there can affect any of them. Deploying the
      # whole set is the simple, always-correct choice; per-function verify_jwt is read from
      # config.toml. If this ever gets too slow, scope it to changed function dirs instead.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
